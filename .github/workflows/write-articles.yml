name: Daily article

# Runs every day and DECIDES every day. It does not publish every day.
#
# scripts/select-story.mjs applies the evidence gate; on a quiet news day it
# returns publish=false and every step below is skipped, so nothing ships.
# Expect roughly 3-5 published posts a week. That is the design, not a fault:
# a cron job that publishes 365 articles a year is the exact shape Google's
# scaled-content-abuse policy is written to catch, and this site's whole
# premise is that its numbers can be checked.

on:
  schedule:
    # 23:00 UTC = 08:00 KST. Late enough that the US news day has happened,
    # early enough to be there before the Korean morning.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many story briefs to build before choosing'
        type: string
        default: '5'
      force_draft:
        description: 'Write as a draft even if the gate passes (dry run)'
        type: boolean
        default: false

permissions:
  contents: write
  # `gh workflow run` creates a workflow_dispatch event, which needs this.
  # Without it the commit lands and the deploy dispatch 403s.
  actions: write

concurrency:
  group: write-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh news so briefs are built on today's clusters
        run: node scripts/refresh-all.mjs news || echo "::warning::news refresh failed, falling back to committed data"

      - name: Generate research briefs
        env:
          BRIEF_COUNT: ${{ inputs.count || '5' }}
        run: node scripts/generate-brief.mjs

      # The gate. Everything after this is conditional on it.
      - name: Choose today's story
        id: pick
        run: node scripts/select-story.mjs

      - name: Nothing to publish
        if: steps.pick.outputs.publish != 'true'
        run: |
          echo "No story cleared the gate: ${{ steps.pick.outputs.reason }}"
          echo "A quiet day is a valid outcome — see scripts/select-story.mjs." >> $GITHUB_STEP_SUMMARY

      - name: Write the article
        id: write
        if: steps.pick.outputs.publish == 'true'
        env:
          # Without this the script exits cleanly and the run commits briefs
          # only — the pipeline degrades to "research for a human" rather than
          # breaking.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GP_PUBLISH: ${{ inputs.force_draft && '0' || '1' }}
        run: node scripts/write-article.mjs "${{ steps.pick.outputs.brief }}"

      - name: Check an article was actually produced
        id: produced
        if: steps.pick.outputs.publish == 'true'
        run: |
          if [ -f .article-output.json ]; then
            echo "ok=true" >> $GITHUB_OUTPUT
            node -e "const a=require('./.article-output.json');console.log('### Published\n\n**'+a.title+'**\n\nKorean edition: '+(a.hasKorean?'yes':'no')+'  \nFrom brief: `'+a.brief+'`')" >> $GITHUB_STEP_SUMMARY
          else
            echo "ok=false" >> $GITHUB_OUTPUT
            echo "::warning::Gate passed but no article was written — ANTHROPIC_API_KEY is probably unset."
            echo "### Gate passed, nothing written\n\nANTHROPIC_API_KEY is probably not configured. Briefs are committed; write from them by hand." >> $GITHUB_STEP_SUMMARY
          fi

      # A generated article that breaks the build must never reach main.
      - name: Build must pass with the new article in place
        if: steps.produced.outputs.ok == 'true'
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}

      - name: Commit
        id: commit
        if: always() && steps.pick.outputs.publish == 'true'
        run: |
          git config user.name  "gamepulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs src/content/posts src/data public/data
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            TITLE=$(node -e "try{console.log(require('./.article-output.json').title)}catch(e){console.log('research briefs')}")
            git commit -m "content: ${TITLE}"
            git pull --rebase --autostash origin main
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # Same reason as refresh-data.yml: a push made with the default token
      # deliberately does not trigger other workflows.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_PAT: ${{ secrets.PAT_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            echo "PAT configured — the push already triggered deploy.yml."
          else
            gh workflow run deploy.yml
          fi
